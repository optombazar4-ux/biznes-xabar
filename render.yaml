# Render Blueprint — Biznes Darslari backend (FastAPI + pipeline + bot)
# Ma'lumotlar bazasi: Neon (DATABASE_URL qo'lda kiritiladi).
services:
  - type: web
    name: biznes-xabar-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Neon connection string (Dashboard'da kiritiladi)
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "vertex"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: "/etc/secrets/google-credentials.json"
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        value: "global"
      - key: VERTEX_GEMINI_MODEL
        value: "gemini-2.5-flash-lite"
      - key: ADMIN_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        value: "@biznesxabari"
      - key: AUTO_PUBLISH
        value: "true"
      - key: AUTO_TELEGRAM
        value: "true"
      - key: AUTO_TELEGRAM_MIN_IMPORTANCE
        value: "4"
      - key: PIPELINE_INTERVAL
        value: "3600"
      - key: RSS_IDEA_ENABLED
        value: "true"
      - key: RSS_IDEA_INTERVAL_DAYS
        value: "7"
      - key: RSS_IDEA_SUGGESTIONS_PER_BATCH
        value: "8"
      - key: RSS_FEED_ITEMS_PER_SOURCE
        value: "5"
      - key: RUN_BACKGROUND_SERVICES
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "https://biznes-xabar.vercel.app"
      - key: CORS_ORIGINS
        value: "https://biznes-xabar.vercel.app"
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: SITE_URL
        value: "https://biznes-xabar.vercel.app"
