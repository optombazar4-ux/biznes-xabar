name: Encrypted database backup

on:
  schedule:
    - cron: "17 22 * * *" # 03:17 Asia/Tashkent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-and-restore-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restore_user
          POSTGRES_PASSWORD: restore_password
          POSTGRES_DB: restore_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore_user -d restore_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      PGPASSWORD: restore_password
    steps:
      - uses: actions/checkout@v5

      - name: Validate backup secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "BACKUP_DATABASE_URL is missing"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || { echo "BACKUP_ENCRYPTION_PASSWORD is missing"; exit 1; }

      - name: Create PostgreSQL custom-format backup
        shell: bash
        run: |
          mkdir -p backup
          docker run --rm \
            --env DATABASE_URL \
            --volume "$PWD/backup:/backup" \
            postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" \
              --format=custom \
              --schema=public \
              --no-owner \
              --no-acl \
              --file=/backup/biznes-xabar.dump && \
              pg_restore --list /backup/biznes-xabar.dump > /backup/restore-list.txt'

      - name: Restore into an isolated database
        shell: bash
        run: |
          docker run --rm \
            --network host \
            --env PGPASSWORD \
            --volume "$PWD/backup:/backup" \
            postgres:17 \
            sh -c 'psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=restore_user \
              --dbname=restore_check \
              --command="DROP SCHEMA public CASCADE;" && \
              pg_restore \
              --host=127.0.0.1 \
              --port=5432 \
              --username=restore_user \
              --dbname=restore_check \
              --no-owner \
              --no-acl \
              --exit-on-error \
              /backup/biznes-xabar.dump && \
              psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=restore_user \
              --dbname=restore_check \
              --tuples-only \
              --command="SELECT COUNT(*) FROM articles;"'

      - name: Encrypt backup and create checksum
        shell: bash
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "backup/biznes-xabar.dump" \
            -out "backup/biznes-xabar-$(date -u +%Y-%m-%d).dump.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          sha256sum backup/*.dump.enc > backup/SHA256SUMS
          rm -f backup/biznes-xabar.dump backup/restore-list.txt

      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: biznes-xabar-db-${{ github.run_id }}
          path: |
            backup/*.dump.enc
            backup/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
